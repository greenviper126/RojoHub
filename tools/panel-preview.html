<!doctype html>
<!--
	Previews the sidebar panel in a browser, without VS Code: loads the built
	dist/webview.js and media/panel.css with a stub VS Code API, sample state and
	VS Code's Dark Modern (or ?theme=light Light Modern) colours. `npm run build` first.
	?picker=1 opens the branch picker on the first project; ?width=NNN sets the sidebar width;
	?workspaces=1, ?empty=1 and ?settings=1 change the sample; ?collapse= and ?click= are below.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../dist/codicons/codicon.css">
<link rel="stylesheet" href="../media/panel.css">
<style id="theme-dark">
:root {
	--vscode-font-family: "Segoe WPC", "Segoe UI", sans-serif;
	--vscode-font-size: 13px;
	--vscode-editor-font-family: Consolas, "Courier New", monospace;
	--vscode-foreground: #cccccc;
	--vscode-descriptionForeground: #9d9d9d;
	--vscode-errorForeground: #f85149;
	--vscode-focusBorder: #0078d4;
	--vscode-sideBar-background: #181818;
	--vscode-sideBarSectionHeader-foreground: #cccccc;
	--vscode-editor-background: #1f1f1f;
	--vscode-widget-border: #313131;
	--vscode-panel-border: #2b2b2b;
	--vscode-list-hoverBackground: #2a2d2e;
	--vscode-list-inactiveSelectionBackground: #37373d;
	--vscode-list-activeSelectionForeground: #ffffff;
	--vscode-badge-background: #616161;
	--vscode-badge-foreground: #f8f8f8;
	--vscode-button-background: #0078d4;
	--vscode-button-foreground: #ffffff;
	--vscode-button-hoverBackground: #026ec1;
	--vscode-button-secondaryBackground: #313131;
	--vscode-button-secondaryForeground: #cccccc;
	--vscode-button-secondaryHoverBackground: #3c3c3c;
	--vscode-dropdown-background: #313131;
	--vscode-dropdown-foreground: #cccccc;
	--vscode-dropdown-border: #3c3c3c;
	--vscode-input-background: #313131;
	--vscode-input-foreground: #cccccc;
	--vscode-input-border: #3c3c3c;
	--vscode-input-placeholderForeground: #989898;
	--vscode-textLink-foreground: #4daafc;
	--vscode-textCodeBlock-background: #2b2b2b;
	--vscode-toolbar-hoverBackground: rgba(90, 93, 94, 0.31);
	--vscode-testing-iconPassed: #73c991;
	--vscode-editorWarning-foreground: #cca700;
	--vscode-inputValidation-warningBackground: #352a05;
	--vscode-inputValidation-warningBorder: #b89500;
	--vscode-inputValidation-errorBackground: #5a1d1d;
	--vscode-inputValidation-errorBorder: #be1100;
	--vscode-progressBar-background: #0078d4;
}
</style>
<style id="theme-light" media="not all">
:root {
	--vscode-font-family: "Segoe WPC", "Segoe UI", sans-serif;
	--vscode-font-size: 13px;
	--vscode-editor-font-family: Consolas, "Courier New", monospace;
	--vscode-foreground: #3b3b3b;
	--vscode-descriptionForeground: #3b3b3b;
	--vscode-errorForeground: #f85149;
	--vscode-focusBorder: #005fb8;
	--vscode-sideBar-background: #f8f8f8;
	--vscode-sideBarSectionHeader-foreground: #3b3b3b;
	--vscode-editor-background: #ffffff;
	--vscode-widget-border: #e5e5e5;
	--vscode-panel-border: #e5e5e5;
	--vscode-list-hoverBackground: #f2f2f2;
	--vscode-list-inactiveSelectionBackground: #e4e6f1;
	--vscode-list-activeSelectionForeground: #000000;
	--vscode-badge-background: #cccccc;
	--vscode-badge-foreground: #3b3b3b;
	--vscode-button-background: #005fb8;
	--vscode-button-foreground: #ffffff;
	--vscode-button-hoverBackground: #0258a8;
	--vscode-button-secondaryBackground: #e5e5e5;
	--vscode-button-secondaryForeground: #3b3b3b;
	--vscode-button-secondaryHoverBackground: #cccccc;
	--vscode-dropdown-background: #ffffff;
	--vscode-dropdown-foreground: #3b3b3b;
	--vscode-dropdown-border: #cecece;
	--vscode-input-background: #ffffff;
	--vscode-input-foreground: #3b3b3b;
	--vscode-input-border: #cecece;
	--vscode-input-placeholderForeground: #767676;
	--vscode-textLink-foreground: #005fb8;
	--vscode-textCodeBlock-background: #f8f8f8;
	--vscode-toolbar-hoverBackground: rgba(184, 184, 184, 0.31);
	--vscode-testing-iconPassed: #388a34;
	--vscode-editorWarning-foreground: #bf8803;
	--vscode-inputValidation-warningBackground: #f6f5d2;
	--vscode-inputValidation-warningBorder: #b89500;
	--vscode-inputValidation-errorBackground: #f2dede;
	--vscode-inputValidation-errorBorder: #be1100;
	--vscode-progressBar-background: #005fb8;
}
</style>
</head>
<body>
<div id="app"><p class="loading">Connecting to Rojo-Hub…</p></div>
<script>
const params = new URLSearchParams(location.search);
if (params.get("theme") === "light") {
	document.getElementById("theme-dark").media = "not all";
	document.getElementById("theme-light").media = "all";
}
if (params.get("width")) document.body.style.width = params.get("width") + "px";

const slot = (id, projectName, port, state, targetLabel, extra = {}) => ({
	id, projectName, repoPath: `C:\\Users\\dev\\${projectName}`, projectFile: "default.project.json", port, portSource: "hash",
	state, connections: 0, target: { kind: "worktree", path: `C:\\Users\\dev\\${projectName}` }, targetLabel, branch: targetLabel,
	mode: "native", warnings: [], error: null, sessionId: null, logFile: "", targetsAt: 1, sourcemap: state === "running" ? { state: "watching", detail: "Kept up to date in " + projectName } : { state: "off", detail: "Kept up to date while the project is serving" }, claim: null, ...extra,
});
const state = {
	service: { running: true, version: "0.13.0", error: null },
	slots: [
		slot("a", "TheLaundryShift", 35045, "running", "chore/untrack-wally-lock", { connections: 1, claim: { label: "laundry-ui", until: Date.now() + 8 * 60000 } }),
		slot("b", "VluxyAI", 35761, "running", "feature/fsm", { target: { kind: "branch", ref: "refs/heads/feature/fsm" }, warnings: ["Packages, ServerPackages come from the primary checkout (not present in this tree)."] }),
		slot("c", "vluxysf", 35813, "stopped", "main"),
		slot("d", "Wonderland", 35344, "error", "main", { error: ["Rojo did not come up on port 35344.", "[INFO  rojo] Rojo server listening on port 35344", "[ERROR rojo] Rojo crashed!", "[ERROR rojo] Details: called `Result::unwrap()` on an `Err` value: NotFound", "[ERROR rojo] at src/change_processor.rs:199"].join("\n") }),
		slot("e", "Frameworks", 35120, "starting", "main"),
	],
	groups: [
		{ id: "g1", name: "Laundry Shift", slotIds: ["a", "b"], groupIds: [], active: true, projectIds: ["a", "b"] },
		{ id: "g2", name: "Everything", slotIds: ["c"], groupIds: ["g1"], active: false, projectIds: ["c", "a", "b"] },
	],
	settings: { portRange: "34873-35872", excludedPorts: [] },
	here: ["a"],
	workspaces: params.get("workspaces") === "1" ? [
		{ file: "C:\\ws\\Laundry.code-workspace", name: "Laundry", slotIds: ["a", "b"], addable: [{ label: "SharedLib", path: "C:\\dev\\SharedLib" }], isWindow: true },
	] : [],
	order: { projects: [], groups: [] },
	agents: {
		url: "http://127.0.0.1:34870/mcp",
		vscode: true,
		list: [
			{ id: "claudeCode", label: "Claude Code", installed: true, state: params.get("nudge") === "1" ? "absent" : "connected", error: null },
			{ id: "codex", label: "Codex", installed: params.get("nocodex") !== "1", state: "absent", error: params.get("agenterror") ? "codex mcp: could not write config.toml" : null },
		],
	},
	// ?nudge=1 shows the "let agents use Studio" notice above Projects.
	agentNudge: params.get("nudge") === "1",
};
if (params.get("empty") === "1") { state.slots = []; state.groups = []; }

const options = [
	{ target: { kind: "worktree", path: "C:\\Users\\dev\\TheLaundryShift" }, label: "chore/untrack-wally-lock", description: "C:\\Users\\dev\\TheLaundryShift", branch: "chore/untrack-wally-lock", isPrimary: true, committedAt: 0 },
	{ target: { kind: "worktree", path: "C:\\orca\\laundry-ui" }, label: "laundry-ui", description: "feat/new-ui · Orca worktree", branch: "feat/new-ui", isPrimary: false, committedAt: 0 },
	{ target: { kind: "branch", ref: "refs/heads/main" }, label: "main", description: "branch · no worktree", branch: "main", isPrimary: false, committedAt: Date.now() / 1000 - 7200 },
	{ target: { kind: "branch", ref: "refs/heads/fix/dryer" }, label: "fix/dryer", description: "branch · no worktree", branch: "fix/dryer", isPrimary: false, committedAt: Date.now() / 1000 - 3 * 86400 },
	{ target: { kind: "branch", ref: "refs/remotes/origin/gh-pages" }, label: "origin/gh-pages", description: "remote branch · no worktree", branch: "origin/gh-pages", isPrimary: false, committedAt: Date.now() / 1000 - 40 * 86400 },
];
let stored = { v: 2, collapsed: { "card:a": false, "card:b": false, "card:c": false, "card:d": false, settings: params.get("settings") === "1" ? false : true, agents: params.get("agents") === "1" ? false : true }, closedGroups: [] };
window.acquireVsCodeApi = () => ({
	getState: () => stored,
	setState: (next) => (stored = next),
	postMessage: (message) => {
		console.log("panel ->", message);
		const reply = (data) => setTimeout(() => window.postMessage(data, "*"), 0);
		if (message.type === "ready") reply({ type: "state", state });
		if (message.type === "targets") reply({ type: "targets", id: message.id, options });
		if (message.type === "fetch") setTimeout(() => { reply({ type: "targets", id: message.id, options }); reply({ type: "fetched", id: message.id, ...(params.get("fetchfail") ? { error: "fatal: unable to access 'https://github.com/…': Could not resolve host" } : {}) }); }, 600);
		if (message.type === "createBranch") setTimeout(() => reply({ type: "branchCreated", id: message.id, error: `A branch named ${message.name} already exists; pick it under Local branches.` }), 400);
		if (message.type === "build") setTimeout(() => reply({ type: "busy", key: `build:${message.id}`, busy: false }), 1500);
		if (message.type === "setAgent") setTimeout(() => {
			if (message.id === "vscode") state.agents.vscode = message.on;
			else state.agents.list.find((agent) => agent.id === message.id).state = message.on ? "connected" : "absent";
			reply({ type: "state", state: JSON.parse(JSON.stringify(state)) });
			reply({ type: "busy", key: `agent:${message.id}`, busy: false });
		}, 700);
		if (message.type === "candidates") reply({ type: "candidates", items: [{ label: "SharedLib", path: "C:\\dev\\SharedLib", source: "workspace" }] });
	},
});
</script>
<script src="../dist/webview.js"></script>
<script>
if (params.get("picker") === "1") setTimeout(() => document.querySelector('[data-action="picker"]')?.click(), 50);
// ?collapse=1 presses the title bar's Collapse All.
if (params.get("collapse") === "1") setTimeout(() => window.postMessage({ type: "collapse" }, "*"), 60);
// ?click=a,b clicks the first element with each data-action in turn, e.g. ?click=solo-group,remove-member
for (const [index, action] of (params.get("click") ?? "").split(",").filter(Boolean).entries())
	setTimeout(() => document.querySelector(`[data-action="${action}"]`)?.click(), 80 + index * 40);
</script>
</body>
</html>
