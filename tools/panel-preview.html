<!doctype html>
<!--
	Previews the sidebar panel in a browser, without VS Code: loads the built
	dist/webview.js and media/panel.css with a stub VS Code API, sample state and
	VS Code's Dark Modern (or ?theme=light Light Modern) colours. `npm run build` first.
	?picker=1 opens the branch picker on the first project; ?width=NNN sets the sidebar width;
	?workspaces=1, ?empty=1, ?settings=1 and ?many=1 change the sample; ?collapse= and ?click= are below;
	?lag=, ?fail=, ?tick= and ?noprefetch=1 change how the stand-in extension answers (see the stub).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../dist/codicons/codicon.css">
<link rel="stylesheet" href="../media/panel.css">
<style id="theme-dark">
:root {
	--vscode-font-family: "Segoe WPC", "Segoe UI", sans-serif;
	--vscode-font-size: 13px;
	--vscode-editor-font-family: Consolas, "Courier New", monospace;
	--vscode-foreground: #cccccc;
	--vscode-descriptionForeground: #9d9d9d;
	--vscode-errorForeground: #f85149;
	--vscode-focusBorder: #0078d4;
	--vscode-sideBar-background: #181818;
	--vscode-sideBarSectionHeader-foreground: #cccccc;
	--vscode-editor-background: #1f1f1f;
	--vscode-widget-border: #313131;
	--vscode-panel-border: #2b2b2b;
	--vscode-list-hoverBackground: #2a2d2e;
	--vscode-list-inactiveSelectionBackground: #37373d;
	--vscode-list-activeSelectionForeground: #ffffff;
	--vscode-badge-background: #616161;
	--vscode-badge-foreground: #f8f8f8;
	--vscode-button-background: #0078d4;
	--vscode-button-foreground: #ffffff;
	--vscode-button-hoverBackground: #026ec1;
	--vscode-button-secondaryBackground: #313131;
	--vscode-button-secondaryForeground: #cccccc;
	--vscode-button-secondaryHoverBackground: #3c3c3c;
	--vscode-dropdown-background: #313131;
	--vscode-dropdown-foreground: #cccccc;
	--vscode-dropdown-border: #3c3c3c;
	--vscode-input-background: #313131;
	--vscode-input-foreground: #cccccc;
	--vscode-input-border: #3c3c3c;
	--vscode-input-placeholderForeground: #989898;
	--vscode-textLink-foreground: #4daafc;
	--vscode-textCodeBlock-background: #2b2b2b;
	--vscode-toolbar-hoverBackground: rgba(90, 93, 94, 0.31);
	--vscode-testing-iconPassed: #73c991;
	--vscode-editorWarning-foreground: #cca700;
	--vscode-inputValidation-warningBackground: #352a05;
	--vscode-inputValidation-warningBorder: #b89500;
	--vscode-inputValidation-errorBackground: #5a1d1d;
	--vscode-inputValidation-errorBorder: #be1100;
	--vscode-progressBar-background: #0078d4;
}
</style>
<style id="theme-light" media="not all">
:root {
	--vscode-font-family: "Segoe WPC", "Segoe UI", sans-serif;
	--vscode-font-size: 13px;
	--vscode-editor-font-family: Consolas, "Courier New", monospace;
	--vscode-foreground: #3b3b3b;
	--vscode-descriptionForeground: #3b3b3b;
	--vscode-errorForeground: #f85149;
	--vscode-focusBorder: #005fb8;
	--vscode-sideBar-background: #f8f8f8;
	--vscode-sideBarSectionHeader-foreground: #3b3b3b;
	--vscode-editor-background: #ffffff;
	--vscode-widget-border: #e5e5e5;
	--vscode-panel-border: #e5e5e5;
	--vscode-list-hoverBackground: #f2f2f2;
	--vscode-list-inactiveSelectionBackground: #e4e6f1;
	--vscode-list-activeSelectionForeground: #000000;
	--vscode-badge-background: #cccccc;
	--vscode-badge-foreground: #3b3b3b;
	--vscode-button-background: #005fb8;
	--vscode-button-foreground: #ffffff;
	--vscode-button-hoverBackground: #0258a8;
	--vscode-button-secondaryBackground: #e5e5e5;
	--vscode-button-secondaryForeground: #3b3b3b;
	--vscode-button-secondaryHoverBackground: #cccccc;
	--vscode-dropdown-background: #ffffff;
	--vscode-dropdown-foreground: #3b3b3b;
	--vscode-dropdown-border: #cecece;
	--vscode-input-background: #ffffff;
	--vscode-input-foreground: #3b3b3b;
	--vscode-input-border: #cecece;
	--vscode-input-placeholderForeground: #767676;
	--vscode-textLink-foreground: #005fb8;
	--vscode-textCodeBlock-background: #f8f8f8;
	--vscode-toolbar-hoverBackground: rgba(184, 184, 184, 0.31);
	--vscode-testing-iconPassed: #388a34;
	--vscode-editorWarning-foreground: #bf8803;
	--vscode-inputValidation-warningBackground: #f6f5d2;
	--vscode-inputValidation-warningBorder: #b89500;
	--vscode-inputValidation-errorBackground: #f2dede;
	--vscode-inputValidation-errorBorder: #be1100;
	--vscode-progressBar-background: #005fb8;
}
</style>
</head>
<body>
<div id="app"><p class="loading">Connecting to Rojo-Hub…</p></div>
<script>
const params = new URLSearchParams(location.search);
if (params.get("theme") === "light") {
	document.getElementById("theme-dark").media = "not all";
	document.getElementById("theme-light").media = "all";
}
if (params.get("width")) document.body.style.width = params.get("width") + "px";

const slot = (id, projectName, port, state, targetLabel, extra = {}) => ({
	id, projectName, repoPath: `C:\\Users\\dev\\${projectName}`, projectFile: "default.project.json", projectFiles: ["default.project.json", "bench.project.json", "test.project.json"], port, portSource: "hash",
	state, connections: 0, target: { kind: "worktree", path: `C:\\Users\\dev\\${projectName}` }, targetLabel, branch: targetLabel,
	mode: "native", warnings: [], error: null, sessionId: null, logFile: "", targetsAt: 1, sourcemap: state === "running" ? { state: "watching", detail: "Kept up to date in " + projectName } : { state: "off", detail: "Kept up to date while the project is serving" }, claim: null, ...extra,
});
const state = {
	service: { running: true, version: "0.13.0", error: null },
	slots: [
		slot("a", "SkyIslands", 35045, "running", "chore/untrack-wally-lock", { connections: 1, claim: { label: "sky-ui", until: Date.now() + 8 * 60000 } }),
		slot("b", "NpcBrain", 35761, "running", "feature/fsm", { target: { kind: "branch", ref: "refs/heads/feature/fsm" }, warnings: ["Packages, ServerPackages come from the primary checkout (not present in this tree)."] }),
		slot("c", "combatlib", 35813, "stopped", "main", { projectName: "combatlib Tests", projectFile: "test.project.json" }),
		slot("d", "Wonderland", 35344, "error", "main", { error: ["Rojo did not come up on port 35344.", "[INFO  rojo] Rojo server listening on port 35344", "[ERROR rojo] Rojo crashed!", "[ERROR rojo] Details: called `Result::unwrap()` on an `Err` value: NotFound", "[ERROR rojo] at src/change_processor.rs:199"].join("\n") }),
		slot("e", "Frameworks", 35120, "starting", "main"),
	],
	groups: [
		{ id: "g1", name: "Sky Islands", slotIds: ["a", "b"], groupIds: [], active: true, projectIds: ["a", "b"] },
		{ id: "g2", name: "Everything", slotIds: ["c"], groupIds: ["g1"], active: false, projectIds: ["c", "a", "b"] },
	],
	settings: { portRange: "34873-35872", excludedPorts: [] },
	here: ["a"],
	workspaces: params.get("workspaces") === "1" ? [
		{ file: "C:\\ws\\Sky.code-workspace", name: "Sky", slotIds: ["a", "b"], addable: [{ label: "SharedLib", path: "C:\\dev\\SharedLib" }], isWindow: true },
	] : [],
	order: { projects: [], groups: [] },
	agents: {
		url: "http://127.0.0.1:34870/mcp",
		vscode: true,
		list: [
			{ id: "claudeCode", label: "Claude Code", installed: true, state: params.get("nudge") === "1" ? "absent" : "connected", error: null },
			{ id: "codex", label: "Codex", installed: params.get("nocodex") !== "1", state: "absent", error: params.get("agenterror") ? "codex mcp: could not write config.toml" : null },
		],
	},
	// ?nudge=1 shows the "let agents use Studio" notice above Projects.
	agentNudge: params.get("nudge") === "1",
};
if (params.get("empty") === "1") { state.slots = []; state.groups = []; }

const options = [
	{ target: { kind: "worktree", path: "C:\\Users\\dev\\SkyIslands" }, label: "chore/untrack-wally-lock", description: "C:\\Users\\dev\\SkyIslands", branch: "chore/untrack-wally-lock", isPrimary: true, committedAt: 0 },
	{ target: { kind: "worktree", path: "C:\\orca\\sky-ui" }, label: "sky-ui", description: "feat/new-ui · Orca worktree", branch: "feat/new-ui", isPrimary: false, committedAt: 0 },
	{ target: { kind: "branch", ref: "refs/heads/main" }, label: "main", description: "branch · no worktree", branch: "main", isPrimary: false, committedAt: Date.now() / 1000 - 7200 },
	{ target: { kind: "branch", ref: "refs/heads/fix/dryer" }, label: "fix/dryer", description: "branch · no worktree", branch: "fix/dryer", isPrimary: false, committedAt: Date.now() / 1000 - 3 * 86400 },
	{ target: { kind: "branch", ref: "refs/remotes/origin/gh-pages" }, label: "origin/gh-pages", description: "remote branch · no worktree", branch: "origin/gh-pages", isPrimary: false, committedAt: Date.now() / 1000 - 40 * 86400 },
];
/*
	?many=1: 25 projects and 10 groups, for render cost. The extra projects
	are folded, as most are in a real panel.
*/
if (params.get("many") === "1") {
	for (let n = 0; n < 20; n++) state.slots.push(slot(`m${n}`, `Project${n}`, 35200 + n, n % 3 === 0 ? "running" : "stopped", n % 2 ? "main" : `feature/thing-${n}`));
	for (let n = 0; n < 8; n++) state.groups.push({ id: `mg${n}`, name: `Group ${n}`, slotIds: [`m${n}`, `m${n + 1}`, `m${n + 2}`], groupIds: n > 0 ? ["g1"] : [], active: n % 4 === 0, projectIds: [] });
}
const expand = (id, seen = new Set()) => {
	if (seen.has(id)) return [];
	seen.add(id);
	const group = state.groups.find((entry) => entry.id === id);
	return group ? [...new Set([...group.slotIds, ...group.groupIds.flatMap((child) => expand(child, seen))])] : [];
};
const fixGroups = () => { for (const group of state.groups) group.projectIds = expand(group.id); };
fixGroups();

let stored = { v: 2, collapsed: { "card:a": false, "card:b": false, "card:c": false, "card:d": false, settings: params.get("settings") === "1" ? false : true, agents: params.get("agents") === "1" ? false : true }, closedGroups: [] };

/*
	A stand-in for the extension and the service. Actions take ?lag= ms
	(default 1200) before the service answers with a state and busy:false,
	so the panel's optimistic look (src/webview/pending.ts) shows first.
	?fail=start (or stop, switch…) answers that action with busy:false and
	no change, as a failed action does. ?tick=ms posts the state that often
	anyway, like the extension's status stream.
*/
const lag = Number(params.get("lag") ?? 1200);
const fails = (type) => (params.get("fail") ?? "").split(",").includes(type);
const post = (data) => setTimeout(() => window.postMessage(data, "*"), 0);
const pushState = () => { fixGroups(); post({ type: "state", state: JSON.parse(JSON.stringify(state)) }); };
const find = (id) => state.slots.find((entry) => entry.id === id);
const later = (ms, work) => setTimeout(work, ms);
/* Runs `work` after the lag, then sends busy:false and the fresh state, as the extension's act() does. */
const act = (type, key, work, extra = 0) => later(lag + extra, () => {
	if (fails(type)) console.log(`(stub) ${type} failed: the extension would show a notification`);
	else work();
	post({ type: "busy", key, busy: false });
	pushState();
});
const serving = (entry) => entry.state === "running" || entry.state === "starting" || entry.state === "error";
window.preview = { state, pushState, post };
if (params.get("tick")) setInterval(pushState, Number(params.get("tick")));

window.acquireVsCodeApi = () => ({
	getState: () => stored,
	setState: (next) => (stored = next),
	postMessage: (message) => {
		console.log("panel ->", JSON.stringify(message));
		const reply = post;
		const id = message.id;
		switch (message.type) {
			case "ready":
				// The extension sends every project's branch list and the addable folders ahead of time.
				pushState();
				if (params.get("noprefetch") !== "1") {
					for (const entry of state.slots) reply({ type: "targets", id: entry.id, options });
					reply({ type: "candidates", items: [{ label: "SharedLib", path: "C:\\dev\\SharedLib", source: "workspace" }] });
				}
				return;
			case "targets":
				return later(params.get("noprefetch") === "1" ? 400 : 0, () => reply({ type: "targets", id, options }));
			case "fetch":
				return later(600, () => { reply({ type: "targets", id, options }); reply({ type: "fetched", id, ...(params.get("fetchfail") ? { error: "fatal: unable to access 'https://github.com/…': Could not resolve host" } : {}) }); });
			case "createBranch":
				return later(400, () => reply({ type: "branchCreated", id, error: `A branch named ${message.name} already exists; pick it under Local branches.` }));
			case "build":
				return later(1500, () => reply({ type: "busy", key: `build:${id}`, busy: false }));
			case "setAgent":
				return act("setAgent", `agent:${id}`, () => {
					if (id === "vscode") state.agents.vscode = message.on;
					else state.agents.list.find((agent) => agent.id === id).state = message.on ? "connected" : "absent";
				});
			case "candidates":
				return later(300, () => reply({ type: "candidates", items: [{ label: "SharedLib", path: "C:\\dev\\SharedLib", source: "workspace" }] }));
			case "start":
				// The service says starting after the lag, running a moment later.
				later(lag, () => { if (!fails("start")) { find(id).state = "starting"; pushState(); } });
				return act("start", `slot:${id}`, () => (find(id).state = "running"), 800);
			case "stop":
				return act("stop", `slot:${id}`, () => { find(id).state = "stopped"; find(id).error = null; });
			case "switch":
				return act("switch", `slot:${id}`, () => Object.assign(find(id), { target: message.target, targetLabel: message.label, branch: message.label }));
			case "setProjectFile":
				return act("setProjectFile", `slot:${id}`, () => (find(id).projectFile = message.file));
			case "sourcemap":
				return act("sourcemap", `slot:${id}`, () => {});
			case "startGroup":
				return act("startGroup", `group:${id}`, () => {
					const members = expand(id);
					if (message.only) {
						for (const group of state.groups) group.active = false;
						for (const entry of state.slots) if (!members.includes(entry.id) && serving(entry)) entry.state = "stopped";
					}
					for (const entry of state.slots) if (members.includes(entry.id) && !serving(entry)) entry.state = "running";
					state.groups.find((group) => group.id === id).active = true;
				});
			case "stopGroup":
				return act("stopGroup", `group:${id}`, () => {
					const group = state.groups.find((entry) => entry.id === id);
					group.active = false;
					const held = new Set(state.groups.filter((other) => other.active).flatMap((other) => expand(other.id)));
					for (const entry of state.slots) if (expand(id).includes(entry.id) && !held.has(entry.id) && serving(entry)) entry.state = "stopped";
				});
			case "stopAll":
				return act("stopAll", "stop-all", () => {
					for (const group of state.groups) group.active = false;
					for (const entry of state.slots) if (serving(entry)) { entry.state = "stopped"; entry.error = null; }
				});
			case "renameGroup":
				return act("renameGroup", `group:${id}`, () => (state.groups.find((group) => group.id === id).name = message.name));
			case "deleteGroup":
				return act("deleteGroup", `group:${id}`, () => {
					state.groups = state.groups.filter((group) => group.id !== id);
					for (const group of state.groups) group.groupIds = group.groupIds.filter((child) => child !== id);
					window.preview.state = state;
				});
			case "addToGroup":
			case "removeFromGroup":
				return act(message.type, `group:${id}`, () => {
					const group = state.groups.find((entry) => entry.id === id);
					const list = message.member.kind === "group" ? "groupIds" : "slotIds";
					if (message.type === "removeFromGroup") group[list] = group[list].filter((entry) => entry !== message.member.id);
					else if (message.member.kind === "workspace") group.slotIds = [...new Set([...group.slotIds, ...state.workspaces.find((entry) => entry.file === message.member.id).slotIds])];
					else group[list] = [...group[list], message.member.id];
				});
			case "newGroup":
				return act("newGroup", "group:new", () => state.groups.push({ id: `g${Date.now()}`, name: message.name, slotIds: [], groupIds: [], active: false, projectIds: [] }));
			case "reorder":
				return act("reorder", "reorder", () => (state.order = { projects: message.projects ?? state.order.projects, groups: message.groups ?? state.order.groups }));
			case "addProject":
				return act("addProject", "add", () => state.slots.push(slot(`n${Date.now()}`, message.path.split("\\").pop(), 35500 + state.slots.length, "stopped", "main", { repoPath: message.path })));
			case "saveSettings":
				return later(lag, () => { state.settings = { portRange: message.portRange, excludedPorts: message.excludedPorts }; pushState(); });
			case "agentNudge":
				return later(lag, () => { state.agentNudge = false; pushState(); });
		}
	},
});
</script>
<script src="../dist/webview.js"></script>
<script>
if (params.get("picker") === "1") setTimeout(() => document.querySelector('[data-action="picker"]')?.click(), 50);
// ?collapse=1 presses the title bar's Collapse All.
if (params.get("collapse") === "1") setTimeout(() => window.postMessage({ type: "collapse" }, "*"), 60);
// ?fold=how:key sends what a header's right-click menu sends, e.g. ?fold=others:card:b or ?fold=collapse:group:g1
if (params.get("fold")) setTimeout(() => {
	const [how, ...rest] = params.get("fold").split(":");
	const key = rest.join(":");
	const list = document.querySelector(`[data-fold-key="${CSS.escape(key)}"]`)?.dataset.foldList ?? "";
	window.postMessage({ type: "fold", key, list, how }, "*");
}, 60);
// ?click=a,b clicks the first element with each data-action in turn, e.g. ?click=solo-group,remove-member
for (const [index, action] of (params.get("click") ?? "").split(",").filter(Boolean).entries())
	setTimeout(() => document.querySelector(`[data-action="${action}"]`)?.click(), 80 + index * 40);
</script>
</body>
</html>
